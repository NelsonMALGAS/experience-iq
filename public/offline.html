<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - ExperienceIQ</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: 217 91% 60%;
        --primary-foreground: 0 0% 100%;
        --background: 0 0% 100%;
        --foreground: 222 47% 11%;
        --muted: 210 40% 96%;
        --muted-foreground: 215 16% 47%;
        --border: 214 32% 91%;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --primary: 217 91% 60%;
          --primary-foreground: 222 47% 11%;
          --background: 222 47% 11%;
          --foreground: 210 40% 98%;
          --muted: 217 33% 17%;
          --muted-foreground: 215 20% 65%;
          --border: 217 33% 17%;
        }
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(
          135deg,
          hsl(var(--background)) 0%,
          hsl(var(--muted)) 100%
        );
        color: hsl(var(--foreground));
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        overflow: hidden;
        position: relative;
      }

      /* Animated background gradient orbs */
      .bg-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.3;
        animation: float 20s ease-in-out infinite;
      }

      .bg-orb:nth-child(1) {
        width: 400px;
        height: 400px;
        background: hsl(var(--primary));
        top: -200px;
        left: -200px;
        animation-delay: 0s;
      }

      .bg-orb:nth-child(2) {
        width: 300px;
        height: 300px;
        background: hsl(217 91% 70%);
        bottom: -150px;
        right: -150px;
        animation-delay: 5s;
      }

      .bg-orb:nth-child(3) {
        width: 250px;
        height: 250px;
        background: hsl(270 91% 70%);
        top: 50%;
        right: 10%;
        animation-delay: 10s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(30px, -30px) scale(1.1);
        }
        66% {
          transform: translate(-20px, 20px) scale(0.9);
        }
      }

      .container {
        max-width: 600px;
        width: 100%;
        text-align: center;
        position: relative;
        z-index: 10;
      }

      /* Animated cloud icon */
      .icon-container {
        margin: 0 auto 2rem;
        position: relative;
        width: 120px;
        height: 120px;
      }

      .icon-bg {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          hsl(var(--primary) / 0.2),
          hsl(var(--primary) / 0.05)
        );
        border-radius: 50%;
        animation: pulse 3s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.8;
        }
      }

      .icon {
        position: relative;
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Cloud SVG */
      .cloud {
        width: 64px;
        height: 64px;
        fill: hsl(var(--primary));
        animation: cloudFloat 3s ease-in-out infinite;
      }

      @keyframes cloudFloat {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      /* Offline text with slash through wifi */
      .offline-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: linear-gradient(
          135deg,
          hsl(var(--muted)) 0%,
          hsl(var(--muted) / 0.6) 100%
        );
        border: 1px solid hsl(var(--border));
        padding: 0.5rem 1rem;
        border-radius: 9999px;
        margin-bottom: 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: hsl(var(--muted-foreground));
      }

      .wifi-off-icon {
        width: 16px;
        height: 16px;
        stroke: hsl(var(--muted-foreground));
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 1rem;
        background: linear-gradient(
          135deg,
          hsl(var(--foreground)),
          hsl(var(--foreground) / 0.7)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.2;
      }

      @media (max-width: 640px) {
        h1 {
          font-size: 2rem;
        }
      }

      p {
        font-size: 1.125rem;
        color: hsl(var(--muted-foreground));
        margin-bottom: 2.5rem;
        line-height: 1.7;
        max-width: 500px;
        margin-left: auto;
        margin-right: auto;
      }

      /* Retry button */
      .button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: linear-gradient(
          135deg,
          hsl(var(--primary)),
          hsl(var(--primary) / 0.9)
        );
        color: hsl(var(--primary-foreground));
        padding: 0.875rem 2rem;
        border-radius: 0.75rem;
        font-weight: 600;
        font-size: 1rem;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow:
          0 4px 6px -1px hsl(var(--primary) / 0.3),
          0 2px 4px -1px hsl(var(--primary) / 0.2);
        text-decoration: none;
      }

      .button:hover {
        transform: translateY(-2px);
        box-shadow:
          0 10px 15px -3px hsl(var(--primary) / 0.4),
          0 4px 6px -2px hsl(var(--primary) / 0.3);
      }

      .button:active {
        transform: translateY(0);
      }

      .button svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        animation: spin 2s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* Status indicators */
      .status-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 1rem;
        margin-top: 3rem;
        max-width: 450px;
        margin-left: auto;
        margin-right: auto;
      }

      .status-item {
        background: hsl(var(--muted) / 0.5);
        border: 1px solid hsl(var(--border));
        border-radius: 0.75rem;
        padding: 1rem;
        backdrop-filter: blur(10px);
      }

      .status-item svg {
        width: 20px;
        height: 20px;
        margin-bottom: 0.5rem;
      }

      .status-item h3 {
        font-size: 0.75rem;
        font-weight: 600;
        color: hsl(var(--muted-foreground));
        margin-bottom: 0.25rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .status-item p {
        font-size: 0.875rem;
        margin: 0;
        color: hsl(var(--foreground));
        font-weight: 600;
      }

      /* Footer */
      .footer {
        margin-top: 3rem;
        font-size: 0.875rem;
        color: hsl(var(--muted-foreground));
      }

      .footer a {
        color: hsl(var(--primary));
        text-decoration: none;
        font-weight: 600;
      }

      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <!-- Animated background orbs -->
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>

    <div class="container">
      <!-- Icon -->
      <div class="icon-container">
        <div class="icon-bg"></div>
        <div class="icon">
          <svg
            class="cloud"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M6.5 19C4.01472 19 2 16.9853 2 14.5C2 12.1564 3.79151 10.2313 6.07974 10.0194C6.54781 7.17213 9.02024 5 12 5C14.9798 5 17.4522 7.17213 17.9203 10.0194C20.2085 10.2313 22 12.1564 22 14.5C22 16.9853 19.9853 19 17.5 19L6.5 19Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>

      <!-- Offline Badge -->
      <div class="offline-badge">
        <svg
          class="wifi-off-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
        You're Offline
      </div>

      <!-- Main Content -->
      <h1>No Internet Connection</h1>
      <p>
        It looks like you're not connected to the internet. Please check your
        connection and try again.
      </p>

      <!-- Retry Button -->
      <button class="button" onclick="window.location.reload()">
        <svg
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"
          />
        </svg>
        Retry Connection
      </button>

      <!-- Status Grid -->
      <div class="status-grid">
        <div class="status-item">
          <svg
            fill="none"
            stroke="hsl(var(--muted-foreground))"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <h3>Status</h3>
          <p>Offline Mode</p>
        </div>
        <div class="status-item">
          <svg
            fill="none"
            stroke="hsl(var(--muted-foreground))"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <h3>Service</h3>
          <p>ExperienceIQ</p>
        </div>
      </div>

      <!-- Footer -->
      <div class="footer">
        <p>
          Cached pages may still be available. <br />
          <a href="/">Return to Home</a>
        </p>
      </div>
    </div>

    <script>
      // Auto-retry connection every 5 seconds
      let retryCount = 0;
      const maxRetries = 10;

      function checkConnection() {
        if (navigator.onLine && retryCount < maxRetries) {
          window.location.reload();
        } else {
          retryCount++;
          if (retryCount < maxRetries) {
            setTimeout(checkConnection, 5000);
          }
        }
      }

      // Listen for online event
      window.addEventListener("online", () => {
        window.location.reload();
      });

      // Start checking after 5 seconds
      setTimeout(checkConnection, 5000);

      // Update time display
      function updateTime() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString();
        // You can add a time display if needed
      }

      setInterval(updateTime, 1000);
    </script>
  </body>
</html>
